build:helm:
  image: "${IMAGE_HELM_CHART_LINT}"
  stage: build
  artifacts:
    paths:
      - ${HELM_CHART_PATH}/${CHART}-*.tgz
#    reports:
#      dotenv: variables.env 
  #<<: *patch_version_from_git
  script:
    - cd "${HELM_CHART_PATH}"
    - helm package .
#    - VERSION=$(grep -e "\[Version:.[0-9A-Za-z.-]*" -o README.md | awk '{print $2}')
#    - echo "TAG=$(echo $VERSION | cut -d"-" -f 1,2,3)" >> $CI_PROJECT_DIR/variables.env 
  #<<: *tags_build


publish:helm:
  image: "${IMAGE_HELM_PUSH}"
  stage: publish
  dependencies:
    - build:helm
  #<<: *patch_version_from_git
  script:
    - cd "${HELM_CHART_PATH}"
    - ls -l
    - helm cm-push -u ${helm_username} -p ${helm_password} *.tgz  ${REPO_URL}
